  <!-- Firebase Script Import (ES Module setup mapped to global window object) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // =========================================================================
    // ⚙️ 自訂 Firebase 專案設定區域 (Custom Firebase Project Config)
    // 取消下方註解並填入您從 Firebase Console 取得的金鑰即可連接至您的專案：
    // =========================================================================
    const customFirebaseConfig = {
      apiKey: window.VERCEL_ENV_VARS?.FIREBASE_API_KEY,
      authDomain: window.VERCEL_ENV_VARS?.FIREBASE_AUTH_DOMAIN,
      projectId: window.VERCEL_ENV_VARS?.FIREBASE_PROJECT_ID,
      storageBucket: window.VERCEL_ENV_VARS?.FIREBASE_STORAGE_BUCKET,
      messagingSenderId: window.VERCEL_ENV_VARS?.FIREBASE_MESSAGING_SENDER_ID,
      appId: window.VERCEL_ENV_VARS?.FIREBASE_APP_ID
    };

    // 優先使用您填寫的 customFirebaseConfig；若未填寫則自動讀取系統內建環境變數
    const firebaseConfig = (customFirebaseConfig && customFirebaseConfig.apiKey) 
      ? customFirebaseConfig 
      : (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);

    const appId = (customFirebaseConfig && customFirebaseConfig.projectId)
      ? customFirebaseConfig.projectId
      : (typeof __app_id !== 'undefined' ? __app_id : 'mgps-qc-tracker-app');

    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Standardized Public Collection Path as per environment rules
        const getPublicCollection = () => collection(db, 'artifacts', appId, 'public', 'data', 'tu_items');
        const getPublicDoc = (docId) => doc(db, 'artifacts', appId, 'public', 'data', 'tu_items', docId);

        window.initFirebaseDB = async (onDataUpdate, onError) => {
          try {
            if (initialAuthToken) {
              await signInWithCustomToken(auth, initialAuthToken);
            } else {
              await signInAnonymously(auth);
            }

            const unsubscribe = onSnapshot(getPublicCollection(), (snapshot) => {
              const items = [];
              snapshot.forEach((doc) => {
                items.push({ id: doc.id, ...doc.data() });
              });
              onDataUpdate(items);
            }, (error) => {
              console.error("Firestore Snapshot Listener Error:", error);
              if (onError) onError(error);
            });

            return { unsubscribe, db, auth };
          } catch (err) {
            console.error("Firebase Auth / Connection Error:", err);
            if (onError) onError(err);
            return null;
          }
        };

        window.FirebaseOps = {
          saveItem: async (item) => {
            if (!auth.currentUser) return;
            const ref = getPublicDoc(item.id);
            await setDoc(ref, item, { merge: true });
          },
          updateItem: async (id, fields) => {
            if (!auth.currentUser) return;
            const ref = getPublicDoc(id);
            await updateDoc(ref, { ...fields, updatedAt: new Date().toISOString() });
          },
          deleteItem: async (id) => {
            if (!auth.currentUser) return;
            const ref = getPublicDoc(id);
            await deleteDoc(ref);
          },
          // Chunked batch write (max 200 items per chunk) to avoid Firestore limits
          saveBatch: async (items) => {
            if (!auth.currentUser || !items.length) return;
            const CHUNK_SIZE = 200;
            for (let i = 0; i < items.length; i += CHUNK_SIZE) {
              const chunk = items.slice(i, i + CHUNK_SIZE);
              const batch = writeBatch(db);
              chunk.forEach(item => {
                const ref = getPublicDoc(item.id);
                batch.set(ref, item, { merge: true });
              });
              await batch.commit();
            }
          },
          updateBatchStatus: async (ids, newStatus) => {
            if (!auth.currentUser || !ids.length) return;
            const CHUNK_SIZE = 200;
            for (let i = 0; i < ids.length; i += CHUNK_SIZE) {
              const chunk = ids.slice(i, i + CHUNK_SIZE);
              const batch = writeBatch(db);
              chunk.forEach(id => {
                const ref = getPublicDoc(id);
                batch.update(ref, { status: newStatus, updatedAt: new Date().toISOString() });
              });
              await batch.commit();
            }
          },
          clearAll: async (items) => {
            if (!auth.currentUser || !items.length) return;
            const CHUNK_SIZE = 200;
            for (let i = 0; i < items.length; i += CHUNK_SIZE) {
              const chunk = items.slice(i, i + CHUNK_SIZE);
              const batch = writeBatch(db);
              chunk.forEach(item => {
                const ref = getPublicDoc(item.id);
                batch.delete(ref);
              });
              await batch.commit();
            }
          }
        };
      } catch (e) {
        console.warn("Firebase initialization failed:", e);
      }
    }
  </script>

  <!-- React Application Core -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // React Error Boundary to prevent blank page crashes
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Uncaught UI Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center space-y-4 shadow-2xl">
                <div className="w-12 h-12 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto">
                  <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                </div>
                <h2 className="text-lg font-bold">系統發生渲染錯誤</h2>
                <p className="text-xs text-slate-400 break-words">{this.state.error?.toString()}</p>
                <button
                  onClick={() => {
                    try { localStorage.removeItem("mgps_qc_data_v5"); } catch(e){}
                    window.location.reload();
                  }}
                  className="w-full bg-sky-600 hover:bg-sky-500 text-white py-2 rounded-xl text-xs font-semibold transition"
                >
                  重設快取並重新載入
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Gas Type Visual Styling Mapping
    const GAS_CONFIG = {
      OXY: { name: "氧氣 (O2)", bg: "bg-emerald-600", text: "text-emerald-700", badge: "bg-emerald-100 text-emerald-800 border-emerald-300" },
      VAC: { name: "負壓吸引 (VAC)", bg: "bg-amber-500", text: "text-amber-700", badge: "bg-amber-100 text-amber-900 border-amber-300" },
      MA4: { name: "醫療空氣 (MA4)", bg: "bg-sky-600", text: "text-sky-700", badge: "bg-sky-100 text-sky-800 border-sky-300" },
      SA7: { name: "器械空氣 (SA7)", bg: "bg-indigo-600", text: "text-indigo-700", badge: "bg-indigo-100 text-indigo-800 border-indigo-300" },
      N2O: { name: "笑氣 (N2O)", bg: "bg-blue-600", text: "text-blue-700", badge: "bg-blue-100 text-blue-800 border-blue-300" },
      CO2: { name: "二氧化碳 (CO2)", bg: "bg-slate-600", text: "text-slate-700", badge: "bg-slate-100 text-slate-800 border-slate-300" }
    };

    // Safe fallback accessor for Gas Config
    const getGasConfig = (gasType) => {
      const code = String(gasType || "").toUpperCase();
      return GAS_CONFIG[code] || {
        name: gasType || "其他氣體",
        bg: "bg-slate-600",
        text: "text-slate-700",
        badge: "bg-slate-100 text-slate-800 border-slate-300"
      };
    };

    // Status definitions & helper styling mapping
    const STATUS_MAP = {
      Pending: { label: "未開始", bg: "bg-slate-100", text: "text-slate-700", border: "border-slate-300", badgeBg: "bg-slate-100 text-slate-700" },
      "In Progress": { label: "檢驗中", bg: "bg-amber-50", text: "text-amber-800", border: "border-amber-300", badgeBg: "bg-amber-100 text-amber-800" },
      Completed: { label: "已合格完成", bg: "bg-emerald-50", text: "text-emerald-800", border: "border-emerald-300", badgeBg: "bg-emerald-100 text-emerald-800" },
      Defect: { label: "有缺失/需跟進", bg: "bg-rose-50", text: "text-rose-800", border: "border-rose-300", badgeBg: "bg-rose-100 text-rose-800" }
    };

    const getStatusConfig = (status) => {
      return STATUS_MAP[status] || STATUS_MAP.Pending;
    };

    // Safe Sanitizer for Data Records
    const sanitizeItem = (item) => {
      if (!item || typeof item !== 'object') return null;
      return {
        id: String(item.id || `TU-${Date.now()}-${Math.random().toString(36).substr(2, 7)}`),
        fileName: String(item.fileName || ''),
        floor: String(item.floor || ''),
        supply: String(item.supply || ''),
        gasType: String(item.gasType || 'OXY').toUpperCase(),
        soaItem: String(item.soaItem || ''),
        facility: String(item.facility || ''),
        tuNo: String(item.tuNo || ''),
        nistNo: String(item.nistNo || ''),
        lineValveNo: String(item.lineValveNo || ''),
        status: STATUS_MAP[item.status] ? item.status : 'Pending',
        remark: String(item.remark || ''),
        updatedAt: String(item.updatedAt || new Date().toISOString())
      };
    };

    // Clean & Normalize AVSU Supply Zone ID
    const cleanSupplyZone = (supply = "", tuNo = "") => {
      const tuStr = String(tuNo || "").trim();
      const supplyStr = String(supply || "").trim();

      const tuAvsuMatch = tuStr.match(/([A-Z0-9/]+F\/)?(AVSU[\s_/-]*\d+[A-Z]?)/i);
      if (tuAvsuMatch) {
        const prefix = tuAvsuMatch[1] ? tuAvsuMatch[1] : "";
        const avsuPart = tuAvsuMatch[2].replace(/[\s_/-]+/g, " ").toUpperCase();
        return `${prefix}${avsuPart}`.trim();
      }

      let str = supplyStr || tuStr;
      if (!str) return "未分類 AVSU 閥箱";

      if (str.match(/\/TU\//i)) {
        str = str.split(/\/TU\//i)[0];
      }

      str = str.replace(/\/(OXY|VAC|MA4|SA7|N2O|CO2|ΟΧΥ)\//gi, "/");
      str = str.replace(/\/+/g, "/").replace(/\/$/, "");

      const match = str.match(/([A-Z0-9/]+F\/)?(AVSU[\s_/-]*\d+[A-Z]?)/i);
      if (match) {
        const prefix = match[1] ? match[1] : "";
        const avsuPart = match[2].replace(/[\s_/-]+/g, " ").toUpperCase();
        return `${prefix}${avsuPart}`.trim();
      }

      return str.trim() || "未分類 AVSU 閥箱";
    };

    // Extract Tower/Block Identifier (e.g. T4, T5, Block D)
    const extractTower = (supply = "", tuNo = "", floor = "") => {
      const combined = `${String(tuNo || '')} ${String(supply || '')} ${String(floor || '')}`;
      const match = combined.match(/\b(T\d+|Tower\s*\d+|Block\s*[A-Z0-9]+)\b/i);
      if (match) {
        let res = match[1].toUpperCase().replace(/\s+/, " ");
        if (res.startsWith("TOWER")) res = res.replace("TOWER", "T");
        return res;
      }
      return "其他 / 未指定大樓";
    };

    function App() {
      // Main dataset state loaded from LocalStorage or empty array
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem("mgps_qc_data_v5");
          if (saved) {
            const parsed = JSON.parse(saved);
            return Array.isArray(parsed) ? parsed.map(sanitizeItem).filter(Boolean) : [];
          }
        } catch(e) {
          console.error("Localstorage parse error:", e);
        }
        return [];
      });

      const [isCloudConnected, setIsCloudConnected] = useState(false);
      const [isSyncing, setIsSyncing] = useState(true);

      // UI Navigation & Control States
      const [activeTab, setActiveTab] = useState("dashboard"); // 'dashboard' | 'table' | 'upload'
      const [dashboardGroupBy, setDashboardGroupBy] = useState("supply"); 
      const [dashboardSort, setDashboardSort] = useState("total_desc"); 
      const [searchQuery, setSearchQuery] = useState("");
      
      // Multi-Select Filters
      const [filterGas, setFilterGas] = useState([]); 
      const [filterStatus, setFilterStatus] = useState([]); 
      const [filterSupply, setFilterSupply] = useState([]); 
      const [filterTower, setFilterTower] = useState([]); 
      const [openFilterMenu, setOpenFilterMenu] = useState(null); 

      const [groupBy, setGroupBy] = useState("supply"); 
      const [sortBy, setSortBy] = useState("tuNo"); 
      const [selectedIds, setSelectedIds] = useState([]);
      const [isParsing, setIsParsing] = useState(false);
      const [parseLogs, setParseLogs] = useState([]);
      const [notification, setNotification] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      // Form state for manual creation
      const [newTuForm, setNewTuForm] = useState({
        floor: "Block D (ONCO) - 7/F",
        supply: "T5/7F/AVSU 701",
        gasType: "OXY",
        soaItem: "1.11.1.01",
        facility: "6-Bed Room",
        tuNo: "",
        status: "Pending",
        remark: ""
      });

      // Persistent Storage Effect with error protection
      useEffect(() => {
        try {
          localStorage.setItem("mgps_qc_data_v5", JSON.stringify(data));
        } catch(e) {
          console.warn("Could not save to localStorage:", e);
        }
      }, [data]);

      // Auto-correct misclassified CO2 records from PDF imports
      useEffect(() => {
        if (!data.length) return;
        let modified = false;
        const corrected = data.map(item => {
          if (!item) return item;
          const tuUpper = String(item.tuNo || "").toUpperCase();
          const supplyUpper = String(item.supply || "").toUpperCase();
          if ((tuUpper.includes("/CO2/") || supplyUpper.includes("/CO2/") || supplyUpper.includes("CO2")) && item.gasType !== "CO2") {
            modified = true;
            const updated = { ...item, gasType: "CO2", updatedAt: new Date().toISOString() };
            if (window.FirebaseOps?.updateItem) {
              window.FirebaseOps.updateItem(item.id, { gasType: "CO2" });
            }
            return updated;
          }
          return item;
        });
        if (modified) {
          setData(corrected);
        }
      }, [data]);

      // Firebase Firestore subscription effect
      useEffect(() => {
        let unsub = null;

        if (window.initFirebaseDB) {
          window.initFirebaseDB(
            (cloudData) => {
              const sanitizedCloud = (cloudData || []).map(sanitizeItem).filter(Boolean);
              setData(sanitizedCloud);
              setIsCloudConnected(true);
              setIsSyncing(false);
            },
            (err) => {
              console.warn("Falling back to local storage due to cloud sync issue:", err);
              setIsCloudConnected(false);
              setIsSyncing(false);
            }
          ).then(res => {
            if (res && res.unsubscribe) {
              unsub = res.unsubscribe;
            } else {
              setIsSyncing(false);
            }
          });
        } else {
          setIsSyncing(false);
        }

        return () => {
          if (unsub) unsub();
        };
      }, []);

      // Re-initialize Lucide Icons on view updates
      useEffect(() => {
        if (window.lucide) {
          try { window.lucide.createIcons(); } catch(e){}
        }
      });

      const showToast = (msg, type = "info") => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      const toggleMultiFilter = (currentArr, setFn, item) => {
        if (currentArr.includes(item)) {
          setFn(currentArr.filter(i => i !== item));
        } else {
          setFn([...currentArr, item]);
        }
      };

      const filteredData = useMemo(() => {
        return data.filter(item => {
          if (!item) return false;
          const tuNo = String(item.tuNo || "");
          const facility = String(item.facility || "");
          const remark = String(item.remark || "");
          const cleanSupply = cleanSupplyZone(item.supply, tuNo);
          const tower = extractTower(item.supply, tuNo, item.floor);
          const query = searchQuery.toLowerCase().trim();

          const matchSearch = query === "" || 
            tuNo.toLowerCase().includes(query) ||
            facility.toLowerCase().includes(query) ||
            cleanSupply.toLowerCase().includes(query) ||
            tower.toLowerCase().includes(query) ||
            remark.toLowerCase().includes(query);

          const matchGas = filterGas.length === 0 || filterGas.includes(item.gasType);
          const matchStatus = filterStatus.length === 0 || filterStatus.includes(item.status);
          const matchSupply = filterSupply.length === 0 || filterSupply.includes(cleanSupply);
          const matchTower = filterTower.length === 0 || filterTower.includes(tower);

          return matchSearch && matchGas && matchStatus && matchSupply && matchTower;
        }).sort((a, b) => {
          if (sortBy === "tuNo") return String(a.tuNo || "").localeCompare(String(b.tuNo || ""), undefined, { numeric: true });
          if (sortBy === "supply") return cleanSupplyZone(a.supply, a.tuNo).localeCompare(cleanSupplyZone(b.supply, b.tuNo));
          if (sortBy === "facility") return String(a.facility || "").localeCompare(String(b.facility || ""));
          if (sortBy === "status") return String(a.status || "").localeCompare(String(b.status || ""));
          return 0;
        });
      }, [data, searchQuery, filterGas, filterStatus, filterSupply, filterTower, sortBy]);

      const groupedData = useMemo(() => {
        if (groupBy === "none") {
          return { "所有檢測點位 (無分組)": filteredData };
        }

        const groups = {};
        filteredData.forEach(item => {
          let key = "未分類";
          if (groupBy === "supply") key = cleanSupplyZone(item.supply, item.tuNo);
          else if (groupBy === "tower") key = `大樓/座: ${extractTower(item.supply, item.tuNo, item.floor)}`;
          else if (groupBy === "gasType") key = `氣體種類: ${getGasConfig(item.gasType).name}`;
          else if (groupBy === "facility") key = item.facility || "其他設施區域";
          else if (groupBy === "status") key = `狀態: ${getStatusConfig(item.status).label}`;

          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });
        return groups;
      }, [filteredData, groupBy]);

      const uniqueSupplies = useMemo(() => {
        const set = new Set();
        data.forEach(d => {
          if (!d) return;
          const zone = cleanSupplyZone(d.supply, d.tuNo);
          if (zone) set.add(zone);
        });
        return Array.from(set).sort();
      }, [data]);

      const uniqueTowers = useMemo(() => {
        const set = new Set();
        data.forEach(d => {
          if (!d) return;
          const tw = extractTower(d.supply, d.tuNo, d.floor);
          if (tw) set.add(tw);
        });
        return Array.from(set).sort();
      }, [data]);

      const stats = useMemo(() => {
        const total = filteredData.length;
        const completed = filteredData.filter(d => d.status === "Completed").length;
        const inProgress = filteredData.filter(d => d.status === "In Progress").length;
        const defect = filteredData.filter(d => d.status === "Defect").length;
        const pending = filteredData.filter(d => d.status === "Pending").length;
        const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

        return { total, completed, inProgress, defect, pending, rate };
      }, [filteredData]);

      const groupingAnalysis = useMemo(() => {
        if (filteredData.length === 0) return { groups: [], topGroup: null, defectGroup: null, avgPassRate: 0, totalGroups: 0 };

        const groupsMap = {};

        filteredData.forEach(item => {
          let key = "未分類";
          if (dashboardGroupBy === "supply") key = cleanSupplyZone(item.supply, item.tuNo);
          else if (dashboardGroupBy === "tower") key = extractTower(item.supply, item.tuNo, item.floor);
          else if (dashboardGroupBy === "gasType") key = getGasConfig(item.gasType).name;
          else if (dashboardGroupBy === "facility") key = item.facility || "其他設施區域";
          else if (dashboardGroupBy === "status") key = getStatusConfig(item.status).label;

          if (!groupsMap[key]) {
            groupsMap[key] = {
              name: key,
              rawKey: item[dashboardGroupBy] || key,
              items: [],
              total: 0,
              completed: 0,
              inProgress: 0,
              defect: 0,
              pending: 0,
              gases: new Set(),
              defectsList: []
            };
          }

          const g = groupsMap[key];
          g.items.push(item);
          g.total += 1;
          if (item.status === "Completed") g.completed += 1;
          else if (item.status === "In Progress") g.inProgress += 1;
          else if (item.status === "Defect") {
            g.defect += 1;
            g.defectsList.push(item);
          } else g.pending += 1;

          if (item.gasType) g.gases.add(item.gasType);
        });

        let groupsList = Object.values(groupsMap).map(g => ({
          ...g,
          passRate: g.total > 0 ? Math.round((g.completed / g.total) * 100) : 0,
          defectRate: g.total > 0 ? Math.round((g.defect / g.total) * 100) : 0
        }));

        groupsList.sort((a, b) => {
          if (dashboardSort === "total_desc") return b.total - a.total;
          if (dashboardSort === "total_asc") return a.total - b.total;
          if (dashboardSort === "passRate_desc") return b.passRate - a.passRate;
          if (dashboardSort === "passRate_asc") return a.passRate - b.passRate;
          if (dashboardSort === "defect_desc") return b.defect - a.defect;
          if (dashboardSort === "name_asc") return String(a.name || '').localeCompare(String(b.name || ''), "zh-Hant");
          return b.total - a.total;
        });

        const topGroup = [...groupsList].sort((a, b) => b.passRate - a.passRate)[0] || null;
        const defectGroup = [...groupsList].sort((a, b) => b.defect - a.defect)[0] || null;
        const avgPassRate = Math.round(groupsList.reduce((acc, curr) => acc + curr.passRate, 0) / (groupsList.length || 1));

        return {
          groups: groupsList,
          topGroup,
          defectGroup,
          avgPassRate,
          totalGroups: groupsList.length
        };
      }, [filteredData, dashboardGroupBy, dashboardSort]);

      // Robust PDF Upload Handler with Safe Sanitization & Parsing Error Guard
      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        setIsParsing(true);
        setParseLogs(["[系統] 開始解析上傳的 PDF 檔案..."]);

        const newParsedItems = [];

        for (let fileIndex = 0; fileIndex < files.length; fileIndex++) {
          const file = files[fileIndex];
          setParseLogs(prev => [...prev, `[讀取] 正解析檔案 ${fileIndex + 1}/${files.length}: ${file.name}`]);

          try {
            if (typeof pdfjsLib === 'undefined') {
              throw new Error("PDF.js 函式庫未成功載入，請確認網路連線。");
            }

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            let currentFloor = "Block D (ONCO) - 7/F";
            let activeSupply = "";
            let activeGas = "";

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
              const page = await pdf.getPage(pageNum);
              const textContent = await page.getTextContent();

              const textItems = textContent.items.map(item => String(item?.str || '').trim()).filter(Boolean);
              const fullText = textItems.join(" ");

              const floorMatch = fullText.match(/Floor:\s*([^\n|]+)/i);
              if (floorMatch) {
                currentFloor = floorMatch[1].trim();
              }

              for (let i = 0; i < textItems.length; i++) {
                const itemStr = textItems[i];

                if (itemStr.includes("AVSU") || itemStr.match(/T\d+\/\d+F\/AVSU/i)) {
                  activeSupply = itemStr;
                  if (itemStr.includes("OXY") || itemStr.includes("ΟΧΥ")) activeGas = "OXY";
                  else if (itemStr.includes("VAC")) activeGas = "VAC";
                  else if (itemStr.includes("MA4")) activeGas = "MA4";
                  else if (itemStr.includes("SA7")) activeGas = "SA7";
                  else if (itemStr.includes("N2O")) activeGas = "N2O";
                  else if (itemStr.includes("CO2")) activeGas = "CO2";
                }

                const isTuLine = itemStr.match(/TU\/(OXY|VAC|MA4|SA7|N2O|CO2|ΟΧΥ)\/\d+/i) || itemStr.includes("/TU/");

                if (isTuLine) {
                  const tuNo = itemStr.replace("ΟΧΥ", "OXY").replace(/^TS\//, "T5/");
                  
                  let itemGas = activeGas;
                  if (tuNo.includes("/OXY/")) itemGas = "OXY";
                  else if (tuNo.includes("/VAC/")) itemGas = "VAC";
                  else if (tuNo.includes("/MA4/")) itemGas = "MA4";
                  else if (tuNo.includes("/SA7/")) itemGas = "SA7";
                  else if (tuNo.includes("/N2O/")) itemGas = "N2O";
                  else if (tuNo.includes("/CO2/")) itemGas = "CO2";

                  let facility = "6-Bed Room";
                  let soaItem = "";

                  for (let offset = -4; offset <= 4; offset++) {
                    const ctx = textItems[i + offset] || "";
                    if (typeof ctx === 'string' && ctx.match(/\d+\.\d+\.\d+/)) soaItem = ctx;
                    if (typeof ctx === 'string' && (ctx.includes("Bed") || ctx.includes("Room") || ctx.includes("Area") || ctx.includes("Isolation") || ctx.includes("Ward"))) {
                      facility = ctx;
                    }
                  }

                  const derivedSupply = cleanSupplyZone(activeSupply, tuNo);

                  const parsedRaw = {
                    id: `TU-PDF-${Date.now()}-${fileIndex}-${i}-${Math.random().toString(36).substr(2, 7)}`,
                    fileName: file.name || "Uploaded PDF",
                    floor: currentFloor || "Block D (ONCO) - 7/F",
                    supply: derivedSupply || "未分類 AVSU 閥箱",
                    gasType: itemGas || "OXY",
                    soaItem: soaItem || "1.11.1.01",
                    facility: facility || "6-Bed Room",
                    tuNo: tuNo,
                    nistNo: "",
                    lineValveNo: "",
                    status: "Pending",
                    remark: "",
                    updatedAt: new Date().toISOString()
                  };

                  const sanitized = sanitizeItem(parsedRaw);
                  if (sanitized) newParsedItems.push(sanitized);
                }
              }
            }
          } catch (err) {
            console.error("Parse Error:", err);
            setParseLogs(prev => [...prev, `[錯誤] 解析檔案 ${file.name} 失敗: ${err.message}`]);
          }
        }

        if (newParsedItems.length > 0) {
          const existingTuSet = new Set(data.map(p => p.tuNo));

          } else {

                            <span className="font-bold text-slate-800 text-sm">{groupTitle}</span>
                            <span className="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-semibold">
                              {groupItems.length} 個點位
                            </span>
                          </div>

                          <div className="flex items-center space-x-3">
                            <div className="text-xs text-slate-500 font-medium">
                              合格率: <strong className="text-emerald-700 font-bold">{groupRate}%</strong> ({groupCompleted}/{groupItems.length})
                            </div>
                            <div className="w-24 bg-slate-200 rounded-full h-2 overflow-hidden">
                              <div className="bg-emerald-500 h-2" style={{ width: `${groupRate}%` }}></div>
                            </div>
                          </div>
                        </div>

                        {/* TUs Table */}
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs border-collapse">
                            <thead>
                              <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase tracking-wider">
                                <th className="p-3 w-8 text-center">選取</th>
                                <th className="p-3">TU 編號 (Terminal Unit)</th>
                                <th className="p-3">氣體種類</th>
                                <th className="p-3">AVSU 閥箱區域</th>
                                <th className="p-3">設施 / 病房 Description</th>
                                <th className="p-3">SoA 編號</th>
                                <th className="p-3">QC 狀態</th>
                                <th className="p-3">缺失備註 / 檢驗紀錄</th>
                                <th className="p-3 text-right">操作</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {groupItems.map(item => {
                                const gasCfg = getGasConfig(item.gasType);
                                const statusCfg = getStatusConfig(item.status);
                                const isChecked = selectedIds.includes(item.id);

                                return (
                                  <tr key={item.id} className={`hover:bg-slate-50 transition ${isChecked ? "bg-sky-50/50" : ""}`}>
                                    
                                    {/* Selection Checkbox */}
                                    <td className="p-3 text-center">
                                      <input
                                        type="checkbox"
                                        checked={isChecked}
                                        onChange={(e) => {
                                          if (e.target.checked) setSelectedIds(prev => [...prev, item.id]);
                                          else setSelectedIds(prev => prev.filter(id => id !== item.id));
                                        }}
                                        className="rounded text-sky-600 focus:ring-sky-500"
                                      />
                                    </td>

                                    {/* TU No. */}
                                    <td className="p-3 font-mono font-bold text-slate-900 whitespace-nowrap">
                                      {item.tuNo}
                                    </td>

                                    {/* Gas Type Badge */}
                                    <td className="p-3 whitespace-nowrap">
                                      <span className={`inline-block px-2 py-0.5 rounded border text-[11px] font-semibold ${gasCfg.badge}`}>
                                        {gasCfg.name}
                                      </span>
                                    </td>

                                    {/* Supply AVSU */}
                                    <td className="p-3 text-slate-600 whitespace-nowrap">
                                      {cleanSupplyZone(item.supply, item.tuNo)}
                                    </td>

                                    {/* Facility Description */}
                                    <td className="p-3 text-slate-700 font-medium">
                                      {item.facility || "—"}
                                    </td>

                                    {/* SoA Item Code */}
                                    <td className="p-3 font-mono text-slate-500 text-[11px]">
                                      {item.soaItem || "—"}
                                    </td>

                                    {/* Status Selector */}
                                    <td className="p-3 whitespace-nowrap">
                                      <select
                                        value={item.status}
                                        onChange={(e) => handleStatusChange(item.id, e.target.value)}
                                        className={`text-xs font-semibold px-2 py-1 rounded-lg border outline-none cursor-pointer ${statusCfg.badgeBg} ${statusCfg.border}`}
                                      >
                                        <option value="Pending">未開始</option>
                                        <option value="In Progress">檢驗中</option>
                                        <option value="Completed">已合格完成</option>
                                        <option value="Defect">有缺失/需跟進</option>
                                      </select>
                                    </td>

                                    {/* Remark Field */}
                                    <td className="p-3">
                                      <input
                                        type="text"
                                        placeholder="新增檢驗備註或缺失細節..."
                                        value={item.remark || ""}
                                        onChange={(e) => handleRemarkChange(item.id, e.target.value)}
                                        className="w-full bg-transparent hover:bg-white focus:bg-white border border-transparent focus:border-slate-300 rounded px-2 py-1 text-xs outline-none transition"
                                      />
                                    </td>

                                    {/* Edit & Delete Action Buttons */}
                                    <td className="p-3 text-right whitespace-nowrap space-x-1">
                                      <button
                                        onClick={() => setEditingItem(item)}
                                        className="p-1 text-slate-400 hover:text-sky-600 transition rounded hover:bg-slate-100"
                                        title="編輯點位詳細資訊"
                                      >
                                        <i data-lucide="edit-3" className="w-4 h-4"></i>
                                      </button>

                                      <button
                                        onClick={() => handleDeleteItem(item.id)}
                                        className="p-1 text-slate-400 hover:text-rose-600 transition rounded hover:bg-slate-100"
                                        title="刪除此點位"
                                      >
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                      </button>
                                    </td>

                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>

                      </div>
                    );
                  })
                )}

              </div>
            )}

            {activeTab === "upload" && (
              <div className="bg-white rounded-xl shadow-xs border border-slate-200 p-6 space-y-6">
                <div>
                  <h2 className="font-bold text-slate-800 text-lg flex items-center space-x-2">
                    <i data-lucide="file-up" className="w-5 h-5 text-sky-600"></i>
                    <span>批量匯入圖紙 PDF 檔案 (Batch PDF Parser)</span>
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">
                    系統自動解析 PDF 文字層，提取 AVSU 控制箱編號、樓層、設施病房與所有 Terminal Unit (TU) 項目並即時同步至雲端。
                  </p>
                </div>

                {/* File Dropzone */}
                <div className="border-2 border-dashed border-slate-300 hover:border-sky-500 rounded-2xl p-8 text-center transition bg-slate-50/50 hover:bg-sky-50/30">
                  <input
                    type="file"
                    accept=".pdf"
                    multiple
                    onChange={handleFileUpload}
                    className="hidden"
                    id="pdf-upload-input"
                    disabled={isParsing}
                  />
                  <label htmlFor="pdf-upload-input" className="cursor-pointer space-y-3 block">
                    <div className="w-14 h-14 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center mx-auto">
                      <i data-lucide="upload-cloud" className="w-8 h-8"></i>
                    </div>
                    <div>
                      <span className="text-sm font-bold text-sky-700">點擊選擇多份 PDF 檔案</span>
                      <span className="text-xs text-slate-500 block mt-1">或直接拖曳 PDF 檔案至此處</span>
                    </div>
                    <span className="inline-block bg-white text-slate-500 border border-slate-200 px-3 py-1 rounded-lg text-xs font-medium">
                      支援多檔同時解析 (NAH Gas Outlet Number Lists)
                    </span>
                  </label>
                </div>

                {/* Parsing Status & Log Console */}
                {parseLogs.length > 0 && (
                  <div className="bg-slate-900 text-slate-200 p-4 rounded-xl space-y-2 text-xs font-mono">
                    <div className="flex items-center justify-between text-slate-400 border-b border-slate-800 pb-2">
                      <span>解析控制台輸出 (Console Logs)</span>
                      {isParsing && <span className="text-sky-400 animate-pulse">處理中...</span>}
                    </div>
                    <div className="max-h-48 overflow-y-auto custom-scrollbar space-y-1">
                      {parseLogs.map((log, idx) => (
                        <div key={idx} className={log.includes("錯誤") ? "text-rose-400" : log.includes("成功") || log.includes("雲端同步") ? "text-emerald-400 font-bold" : "text-slate-300"}>
                          {log}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Add Item Modal */}
          {showAddModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-4 animate-fadeIn">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-800 text-base">新增檢測點位 (Add New TU)</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleAddTuSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Terminal Unit (TU) 編號 *</label>
                    <input
                      type="text"
                      placeholder="例: T5/7F/AVSU701/TU/OXY/01"
                      value={newTuForm.tuNo}
                      onChange={(e) => setNewTuForm({ ...newTuForm, tuNo: e.target.value })}
                      className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500 font-mono"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">氣體種類</label>
                      <select
                        value={newTuForm.gasType}
                        onChange={(e) => setNewTuForm({ ...newTuForm, gasType: e.target.value })}
                        className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500"
                      >
                        {Object.keys(GAS_CONFIG).map(gKey => (
                          <option key={gKey} value={gKey}>{GAS_CONFIG[gKey].name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">AVSU 閥箱名稱</label>
                      <input
                        type="text"
                        value={newTuForm.supply}
                        onChange={(e) => setNewTuForm({ ...newTuForm, supply: e.target.value })}
                        className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">設施 / 病房描述</label>
                      <input
                        type="text"
                        value={newTuForm.facility}
                        onChange={(e) => setNewTuForm({ ...newTuForm, facility: e.target.value })}
                        className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500"
                      />
                    </div>

                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">SoA 項目代碼</label>
                      <input
                        type="text"
                        value={newTuForm.soaItem}
                        onChange={(e) => setNewTuForm({ ...newTuForm, soaItem: e.target.value })}
                        className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500 font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">檢驗狀態</label>
                    <select
                      value={newTuForm.status}
                      onChange={(e) => setNewTuForm({ ...newTuForm, status: e.target.value })}
                      className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500"
                    >
                      <option value="Pending">未開始</option>
                      <option value="In Progress">檢驗中</option>
                      <option value="Completed">已合格完成</option>
                      <option value="Defect">有缺失/需跟進</option>
                    </select>
                  </div>

                  <div className="flex justify-end space-x-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 border border-slate-300 text-slate-600 rounded-xl hover:bg-slate-50 font-semibold"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-semibold shadow-xs"
                    >
                      確認新增
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Edit Record Modal */}
          {editingItem && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-4 animate-fadeIn">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-800 text-base">編輯點位 (Edit TU Record)</h3>
                  <button onClick={() => setEditingItem(null)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveEditItem} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Terminal Unit (TU) 編號 *</label>
                    <input
                      type="text"
                      value={editingItem.tuNo}
                      onChange={(e) => setEditingItem({ ...editingItem, tuNo: e.target.value })}
                      className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500 font-mono"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">氣體種類</label>
                      <select
                        value={editingItem.gasType}
                        onChange={(e) => setEditingItem({ ...editingItem, gasType: e.target.value })}
                        className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500"
                      >
                        {Object.keys(GAS_CONFIG).map(gKey => (
                          <option key={gKey} value={gKey}>{GAS_CONFIG[gKey].name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">AVSU 閥箱名稱</label>
                      <input
                        type="text"
                        value={editingItem.supply}
                        onChange={(e) => setEditingItem({ ...editingItem, supply: e.target.value })}
                        className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">設施 / 病房描述</label>
                    <input
                      type="text"
                      value={editingItem.facility}
                      onChange={(e) => setEditingItem({ ...editingItem, facility: e.target.value })}
                      className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500"
                    />
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">檢驗備註 / 缺失細節</label>
                    <textarea
                      rows="2"
                      value={editingItem.remark || ""}
                      onChange={(e) => setEditingItem({ ...editingItem, remark: e.target.value })}
                      className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-sky-500"
                      placeholder="請輸入缺失說明或量測數據..."
                    ></textarea>
                  </div>

                  <div className="flex justify-end space-x-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setEditingItem(null)}
                      className="px-4 py-2 border border-slate-300 text-slate-600 rounded-xl hover:bg-slate-50 font-semibold"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-semibold shadow-xs"
                    >
                      儲存更新
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Application wrapped in ErrorBoundary
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
